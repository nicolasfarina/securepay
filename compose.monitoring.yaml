services:
  api:
    environment:
      SPRING_PROFILES_ACTIVE: postgres,monitoring

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
    depends_on:
      - alertmanager
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
      - /prometheus:rw,nosuid,nodev,size=128m,uid=65534,gid=65534,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${SECUREPAY_PROMETHEUS_TOKEN_FILE:?Set SECUREPAY_PROMETHEUS_TOKEN_FILE to a local token file}:/run/secrets/securepay-scrape-token:ro
    ports:
      - "127.0.0.1:${SECUREPAY_PROMETHEUS_PORT:-9090}:9090"

  alertmanager:
    build:
      context: .
      dockerfile: monitoring/alertmanager/Dockerfile
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    depends_on:
      - alert-receiver
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
      - /alertmanager:rw,nosuid,nodev,size=16m,uid=65534,gid=65534,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  alert-receiver:
    build:
      context: .
      dockerfile: monitoring/alert-receiver/Dockerfile
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${SECUREPAY_RECEIVER_PORT:-0}:8080"
