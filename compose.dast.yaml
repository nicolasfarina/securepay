# Standalone stack. Never combine with the persistent or production Compose files.
services:
  api:
    image: securepay:zap-local
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      SECUREPAY_DEMO_PASSWORD: dast-local-only
      SECUREPAY_TRACING_OTLP_ENABLED: "false"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [isolated]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    command: [python3, /zap/wrk/passive.py]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./dast:/zap/wrk:rw
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [isolated]
networks:
  isolated:
    internal: true
