rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="securepay",instance="api:8080"}'
        values: '0x10'
      - series: 'http_server_requests_seconds_count{uri="/api/payments",status="200"}'
        values: '0+24x10'
      - series: 'http_server_requests_seconds_count{uri="/api/payments",status="500"}'
        values: '0+6x10'
      - series: 'http_server_requests_seconds_bucket{uri="/api/payments",status="200",le="0.5"}'
        values: '0+12x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: SecurePayScrapeFailed
        exp_alerts:
          - exp_labels:
              job: securepay
              instance: api:8080
              severity: warning
            exp_annotations:
              summary: "Prometheus cannot scrape SecurePay"
              action: "Check the API, network, and scraper authentication before diagnosing availability."
      - eval_time: 10m
        alertname: SecurePayHighServerErrorRate
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Payment API 5xx rate is above 5%"
              action: "Inspect application errors and dependencies; compare with request volume."
      - eval_time: 10m
        alertname: SecurePaySlowPayments
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Less than 95% of successful payment requests completed within 500 ms"
              action: "Inspect latency and database health; compare with request volume."
  - interval: 1m
    input_series:
      - series: 'up{job="securepay",instance="api:8080"}'
        values: '1x10'
      - series: 'http_server_requests_seconds_count{uri="/api/payments",status="200"}'
        values: '0+2x10'
      - series: 'http_server_requests_seconds_count{uri="/api/payments",status="500"}'
        values: '0+1x10'
      - series: 'http_server_requests_seconds_bucket{uri="/api/payments",status="200",le="0.5"}'
        values: '0+1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: SecurePayScrapeFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: SecurePayHighServerErrorRate
        exp_alerts: []
      - eval_time: 10m
        alertname: SecurePaySlowPayments
        exp_alerts: []
