services:
  postgres:
    image: postgres:17.6-alpine
    container_name: securepay-postgres
    environment:
      POSTGRES_DB: securepay
      POSTGRES_USER: securepay
      POSTGRES_PASSWORD: ${SECUREPAY_DATABASE_PASSWORD:-local-postgres-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - securepay-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securepay -d securepay"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securepay-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SECUREPAY_DATABASE_URL: jdbc:postgresql://postgres:5432/securepay
      SECUREPAY_DATABASE_USERNAME: securepay
      SECUREPAY_DATABASE_PASSWORD: ${SECUREPAY_DATABASE_PASSWORD:-local-postgres-only}
      SECUREPAY_JWT_SECRET: ${SECUREPAY_JWT_SECRET:-local-development-jwt-secret-change-this-before-deploy-2026}
    ports:
      - "127.0.0.1:${SECUREPAY_API_PORT:-8080}:8080"

volumes:
  securepay-postgres-data:
