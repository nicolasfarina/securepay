services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_DB: securepay
      POSTGRES_USER: securepay
      POSTGRES_PASSWORD: ${SECUREPAY_DATABASE_PASSWORD:?Set SECUREPAY_DATABASE_PASSWORD before starting Compose}
    volumes:
      - securepay-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "securepay", "-d", "securepay"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    image: ${SECUREPAY_IMAGE:-securepay:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SECUREPAY_DATABASE_URL: jdbc:postgresql://postgres:5432/securepay
      SECUREPAY_DATABASE_USERNAME: securepay
      SECUREPAY_DATABASE_PASSWORD: ${SECUREPAY_DATABASE_PASSWORD:?Set SECUREPAY_DATABASE_PASSWORD before starting Compose}
      SECUREPAY_DEMO_PASSWORD: ${SECUREPAY_DEMO_PASSWORD:?Set SECUREPAY_DEMO_PASSWORD before starting Compose}
      SECUREPAY_JWT_SECRET: ${SECUREPAY_JWT_SECRET:?Set SECUREPAY_JWT_SECRET before starting Compose}
    ports:
      - "127.0.0.1:${SECUREPAY_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  securepay-postgres-data:
