spring:
  datasource:
    url: ${SECUREPAY_DATABASE_URL:jdbc:postgresql://localhost:5432/securepay}
    username: ${SECUREPAY_DATABASE_USERNAME:securepay}
    password: ${SECUREPAY_DATABASE_PASSWORD:local-postgres-only}
  jpa:
    hibernate:
      ddl-auto: validate

securepay:
  security:
    jwt-secret: ${SECUREPAY_JWT_SECRET:local-development-jwt-secret-change-this-before-deploy-2026}
