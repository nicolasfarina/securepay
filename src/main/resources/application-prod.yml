spring:
  datasource:
    url: ${SECUREPAY_DATABASE_URL}
    username: ${SECUREPAY_DATABASE_USERNAME}
    password: ${SECUREPAY_DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

securepay:
  security:
    demo-password: ${SECUREPAY_DEMO_PASSWORD}
    jwt-secret: ${SECUREPAY_JWT_SECRET}
    jwt-expiration-seconds: ${SECUREPAY_JWT_EXPIRATION_SECONDS:3600}
