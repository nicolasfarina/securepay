spring:
  datasource:
    url: ${SECUREPAY_DATABASE_URL}
    username: ${SECUREPAY_DATABASE_USERNAME}
    password: ${SECUREPAY_DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

securepay:
  security:
    # Must be injected from a secret store until an external identity provider is configured.
    demo-password: ${SECUREPAY_DEMO_PASSWORD}
