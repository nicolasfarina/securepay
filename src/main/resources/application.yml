spring:
  application:
    name: securepay
  profiles:
    default: local

server:
  error:
    include-message: never

logging:
  structured:
    format:
      console: logstash

management:
  tracing:
    sampling:
      probability: ${SECUREPAY_TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: W3C
  opentelemetry:
    resource-attributes:
      "service.name": securepay
    tracing:
      export:
        otlp:
          enabled: ${SECUREPAY_TRACING_OTLP_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

securepay:
  rate-limit:
    max-tracked-clients: 10000
    login:
      max-attempts: 30
      window: 1m
    payments:
      max-requests: 100
      window: 1m
